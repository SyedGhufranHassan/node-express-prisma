services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: "postgresql://inventory:inventory_dev@db:5432/inventory"
      JWT_SECRET: "local-development-only"
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_dev
      POSTGRES_DB: inventory
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
